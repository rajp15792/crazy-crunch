<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Crazy Crunch — Fresh Homemade Snacks & Savouries</title>
    
    <!-- PWA Primary Meta Tags -->
    <meta name="title" content="Crazy Crunch — Fresh Homemade Snacks & Savouries" />
    <meta name="description" content="Order fresh, crunchy, delicious traditional snacks and savouries online. Chakli, Sev, Khari, Laddus, and more delivered fresh to your doorstep!" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Crazy Crunch" />
    <meta name="application-name" content="Crazy Crunch" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#ea580c" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background-color: #fbf9f5;
        color: #1f2937;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      h1, h2, h3, h4, h5, h6, .brand-font {
        font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#fbf9f5] min-h-screen text-slate-800 antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('✅ ServiceWorker registered with scope:', reg.scope);
            })
            .catch(err => {
              console.log('⚠️ ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
