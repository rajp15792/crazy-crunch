<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="plateGrad7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="85%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
    <radialGradient id="dfLadduGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="60%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>
    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#431407" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#plateGrad7)"/>
  <ellipse cx="200" cy="190" rx="145" ry="65" fill="#f8fafc" stroke="#fed7aa" stroke-width="4" filter="url(#shadow7)"/>

  <!-- Laddu 1 (Left) -->
  <g filter="url(#shadow7)" transform="translate(140, 165)">
    <circle cx="0" cy="0" r="42" fill="url(#dfLadduGrad)"/>
    <!-- Almond slivers & Pistachio specks -->
    <ellipse cx="-12" cy="-14" rx="6" ry="3" transform="rotate(35 -12 -14)" fill="#fde68a"/>
    <ellipse cx="10" cy="-18" rx="6" ry="3" transform="rotate(-25 10 -18)" fill="#86efac"/>
    <ellipse cx="-6" cy="14" rx="5" ry="2.5" transform="rotate(70 -6 14)" fill="#fef08a"/>
    <ellipse cx="16" cy="8" rx="5" ry="3" transform="rotate(-30 16 8)" fill="#86efac"/>
  </g>

  <!-- Laddu 2 (Right) -->
  <g filter="url(#shadow7)" transform="translate(255, 168)">
    <circle cx="0" cy="0" r="40" fill="url(#dfLadduGrad)"/>
    <ellipse cx="-10" cy="-12" rx="5.5" ry="2.8" transform="rotate(-35 -10 -12)" fill="#86efac"/>
    <ellipse cx="12" cy="-14" rx="6" ry="3" transform="rotate(40 12 -14)" fill="#fde68a"/>
    <ellipse cx="0" cy="14" rx="5" ry="2.5" transform="rotate(-15 0 14)" fill="#fef08a"/>
  </g>

  <!-- Laddu 3 (Front Center) -->
  <g filter="url(#shadow7)" transform="translate(198, 148)">
    <circle cx="0" cy="0" r="48" fill="url(#dfLadduGrad)"/>
    <!-- Almond sliver -->
    <ellipse cx="-16" cy="-18" rx="7" ry="3.5" transform="rotate(40 -16 -18)" fill="#fde68a"/>
    <!-- Pistachio sliver -->
    <ellipse cx="14" cy="-20" rx="6.5" ry="3.2" transform="rotate(-25 14 -20)" fill="#86efac"/>
    <!-- Cashew piece -->
    <path d="M -15,10 Q -8,18 0,14 Q -6,8 -15,10 Z" fill="#fffbeb"/>
    <ellipse cx="20" cy="12" rx="6" ry="3" transform="rotate(-40 20 12)" fill="#fde68a"/>
    <ellipse cx="-24" cy="2" rx="5.5" ry="2.8" transform="rotate(15 -24 2)" fill="#86efac"/>
    <circle cx="2" cy="-4" r="2.5" fill="#fef08a"/>
    <circle cx="8" cy="22" r="2" fill="#86efac"/>
  </g>

  <rect x="20" y="20" rx="8" width="145" height="28" fill="#ea580c"/>
  <text x="92" y="39" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="0.5">DRY FRUIT LADDU</text>
</svg>
