<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="plateGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="85%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7c2d12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#plateGrad2)"/>
  <ellipse cx="200" cy="185" rx="145" ry="65" fill="#f8fafc" stroke="#fed7aa" stroke-width="4" filter="url(#shadow2)"/>

  <!-- Mini stuffed triangle samosas -->
  <!-- Snack 1 -->
  <g filter="url(#shadow2)" transform="translate(140, 160) rotate(-15)">
    <polygon points="0,-40 38,30 -38,30" fill="url(#crustGrad)" stroke="#9a3412" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M -30,26 Q 0,34 30,26" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-5" cy="5" r="1.5" fill="#78350f"/>
    <circle cx="8" cy="-8" r="1.5" fill="#78350f"/>
  </g>

  <!-- Snack 2 (Center) -->
  <g filter="url(#shadow2)" transform="translate(200, 150) rotate(5)">
    <polygon points="0,-48 44,36 -44,36" fill="url(#crustGrad)" stroke="#9a3412" stroke-width="3" stroke-linejoin="round"/>
    <path d="M -36,32 Q 0,42 36,32" fill="none" stroke="#78350f" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2" fill="#78350f"/>
    <circle cx="12" cy="14" r="1.5" fill="#78350f"/>
    <circle cx="-14" cy="-5" r="1.5" fill="#78350f"/>
  </g>

  <!-- Snack 3 -->
  <g filter="url(#shadow2)" transform="translate(260, 165) rotate(22)">
    <polygon points="0,-38 36,28 -36,28" fill="url(#crustGrad)" stroke="#9a3412" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M -28,24 Q 0,32 28,24" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
  </g>

  <rect x="20" y="20" rx="8" width="140" height="28" fill="#ea580c"/>
  <text x="90" y="39" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="0.5">MINI STUFFED SNACK</text>
</svg>
