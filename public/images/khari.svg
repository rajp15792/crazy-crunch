<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="plateGrad6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="85%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
    <linearGradient id="puffGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7c2d12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#plateGrad6)"/>
  <ellipse cx="200" cy="185" rx="145" ry="65" fill="#f8fafc" stroke="#fed7aa" stroke-width="4" filter="url(#shadow6)"/>

  <!-- Khari 1 (Left) -->
  <g filter="url(#shadow6)" transform="translate(130, 150) rotate(-10)">
    <rect x="-35" y="-22" width="70" height="44" rx="6" fill="url(#puffGrad)" stroke="#78350f" stroke-width="2"/>
    <!-- Flaky puff layers -->
    <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <line x1="-32" y1="0" x2="32" y2="0" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <line x1="-30" y1="10" x2="30" y2="10" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Khari 2 (Right) -->
  <g filter="url(#shadow6)" transform="translate(265, 155) rotate(12)">
    <rect x="-35" y="-22" width="70" height="44" rx="6" fill="url(#puffGrad)" stroke="#78350f" stroke-width="2"/>
    <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <line x1="-32" y1="0" x2="32" y2="0" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
    <line x1="-30" y1="10" x2="30" y2="10" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Khari 3 (Center Top) -->
  <g filter="url(#shadow6)" transform="translate(195, 140)">
    <rect x="-42" y="-26" width="84" height="52" rx="7" fill="url(#puffGrad)" stroke="#78350f" stroke-width="2.5"/>
    <line x1="-38" y1="-12" x2="38" y2="-12" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-38" y1="12" x2="38" y2="12" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Cumin / Jeera seeds -->
    <ellipse cx="-15" cy="-18" rx="3.5" ry="1.2" transform="rotate(25 -15 -18)" fill="#451a03"/>
    <ellipse cx="12" cy="-18" rx="3.5" ry="1.2" transform="rotate(-30 12 -18)" fill="#451a03"/>
    <ellipse cx="0" cy="-6" rx="3.5" ry="1.2" transform="rotate(10 0 -6)" fill="#451a03"/>
  </g>

  <rect x="20" y="20" rx="8" width="105" height="28" fill="#ea580c"/>
  <text x="72" y="39" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="0.5">CRISPY KHARI</text>
</svg>
