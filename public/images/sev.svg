<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="plateGrad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="85%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
    <linearGradient id="sevGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7c2d12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#plateGrad3)"/>
  <ellipse cx="200" cy="185" rx="140" ry="60" fill="#f8fafc" stroke="#fed7aa" stroke-width="4" filter="url(#shadow3)"/>

  <!-- Crispy Sev strands mound -->
  <g filter="url(#shadow3)" stroke="url(#sevGrad)" stroke-width="3" stroke-linecap="round">
    <!-- Base cluster -->
    <path d="M 120,185 Q 150,150 180,180 T 240,165 T 280,180" fill="none"/>
    <path d="M 130,175 Q 160,135 200,165 T 270,170" fill="none"/>
    <path d="M 140,165 Q 190,120 230,155 T 260,160" fill="none"/>
    <path d="M 150,160 Q 180,130 210,150 T 250,155" fill="none"/>
    <path d="M 135,190 Q 170,170 210,180 T 265,185" fill="none"/>
    <path d="M 160,145 Q 200,115 240,140" fill="none"/>
    <path d="M 170,135 Q 200,110 230,130" fill="none"/>
    <path d="M 155,180 Q 185,140 220,170 T 250,175" fill="none"/>
    <path d="M 145,170 Q 175,130 215,160 T 255,165" fill="none"/>
    <path d="M 165,155 Q 195,125 225,145" fill="none"/>
    <path d="M 175,175 Q 205,145 235,165" fill="none"/>
    <path d="M 185,130 Q 205,115 225,135" fill="none"/>
  </g>

  <!-- Spices / curry leaves garnish -->
  <path d="M 195,120 Q 205,115 210,125 Q 200,130 195,120 Z" fill="#15803d"/>
  <circle cx="170" cy="140" r="1.5" fill="#ef4444"/>
  <circle cx="230" cy="150" r="1.5" fill="#ef4444"/>
  <circle cx="205" cy="160" r="1.5" fill="#ef4444"/>

  <rect x="20" y="20" rx="8" width="80" height="28" fill="#ea580c"/>
  <text x="60" y="39" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="0.5">CRISPY SEV</text>
</svg>
