<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>

  <!-- Subtle Crunchy Pattern Overlay -->
  <circle cx="28" cy="36" r="4" fill="#ffedd5" opacity="0.3"/>
  <circle cx="164" cy="48" r="6" fill="#ffedd5" opacity="0.25"/>
  <circle cx="160" cy="148" r="5" fill="#ffedd5" opacity="0.3"/>
  <circle cx="34" cy="154" r="4" fill="#ffedd5" opacity="0.2"/>

  <!-- Center Golden Crunchy Chakli / Snack Wheel -->
  <g filter="url(#shadow)" transform="translate(96, 84)">
    <!-- Outer crunch burst ring -->
    <path d="M 0,-44 L 8,-36 L 22,-40 L 22,-26 L 36,-22 L 28,-10 L 42,0 L 28,10 L 36,22 L 22,26 L 22,40 L 8,36 L 0,44 L -8,36 L -22,40 L -22,26 L -36,22 L -28,10 L -42,0 L -28,-10 L -36,-22 L -22,-26 L -22,-40 L -8,-36 Z"
          fill="url(#goldGrad)" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Chakli Spiral -->
    <path d="M 0,0 
             A 6 6 0 0 1 6,6 
             A 12 12 0 0 1 -6,12 
             A 18 18 0 0 1 -18,-6 
             A 24 24 0 0 1 6,-24
             A 30 30 0 0 1 30,6" 
          fill="none" stroke="#78350f" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Center Sesame Seed accents -->
    <ellipse cx="-6" cy="-4" rx="1.8" ry="3" transform="rotate(30 -6 -4)" fill="#fff" opacity="0.9"/>
    <ellipse cx="8" cy="8" rx="1.8" ry="3" transform="rotate(-40 8 8)" fill="#fff" opacity="0.9"/>
    <ellipse cx="-12" cy="10" rx="1.8" ry="3" transform="rotate(15 -12 10)" fill="#fff" opacity="0.9"/>
    <ellipse cx="14" cy="-8" rx="1.8" ry="3" transform="rotate(70 14 -8)" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Brand Typography -->
  <text x="96" y="148" text-anchor="middle" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="1.5">
    CRAZY
  </text>
  <text x="96" y="168" text-anchor="middle" font-family="'Outfit', 'Impact', sans-serif" font-weight="800" font-size="14" fill="#fed7aa" letter-spacing="3">
    CRUNCH
  </text>
</svg>
