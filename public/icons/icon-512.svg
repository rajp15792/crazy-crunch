<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#dd4c06"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#431407" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>

  <!-- Decorative snack spice bursts -->
  <circle cx="80" cy="90" r="10" fill="#fed7aa" opacity="0.3"/>
  <circle cx="430" cy="110" r="14" fill="#fed7aa" opacity="0.25"/>
  <circle cx="420" cy="380" r="12" fill="#fed7aa" opacity="0.3"/>
  <circle cx="90" cy="400" r="11" fill="#fed7aa" opacity="0.2"/>

  <!-- Center Snack Artwork -->
  <g filter="url(#shadow512)" transform="translate(256, 220)">
    <!-- Starburst Crunch Shape -->
    <path d="M 0,-115 L 21,-94 L 58,-105 L 58,-68 L 94,-58 L 73,-26 L 110,0 L 73,26 L 94,58 L 58,68 L 58,105 L 21,94 L 0,115 L -21,94 L -58,105 L -58,68 L -94,58 L -73,26 L -110,0 L -73,-26 L -94,-58 L -58,-68 L -58,-105 L -21,-94 Z"
          fill="url(#goldGrad512)" stroke="#b45309" stroke-width="6.5" stroke-linejoin="round"/>
    
    <!-- Deep Crisp Chakli Spiral -->
    <path d="M 0,0 
             A 16 16 0 0 1 16,16 
             A 32 32 0 0 1 -16,32 
             A 48 48 0 0 1 -48,-16 
             A 64 64 0 0 1 16,-64
             A 80 80 0 0 1 80,16" 
          fill="none" stroke="#78350f" stroke-width="9" stroke-linecap="round"/>

    <!-- Crunchy Sesame Seed Accents -->
    <ellipse cx="-16" cy="-10" rx="4" ry="8" transform="rotate(30 -16 -10)" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="22" cy="22" rx="4" ry="8" transform="rotate(-40 22 22)" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="-32" cy="26" rx="4" ry="8" transform="rotate(15 -32 26)" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="38" cy="-22" rx="4" ry="8" transform="rotate(70 38 -22)" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="0" cy="-44" rx="4" ry="8" transform="rotate(-15 0 -44)" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="4">
    CRAZY
  </text>
  <text x="256" y="440" text-anchor="middle" font-family="'Outfit', 'Impact', sans-serif" font-weight="800" font-size="34" fill="#fed7aa" letter-spacing="8">
    CRUNCH
  </text>
</svg>
