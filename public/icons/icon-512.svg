<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f382c"/>
      <stop offset="50%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#0a2920"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85"/>
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.5"/>

  <!-- Center Decorative Icon (Crunch Wheat & Golden Crown Motif) -->
  <g filter="url(#logoGlow)" transform="translate(256, 190)">
    <!-- Golden Khari / Crown Shield -->
    <path d="M-60,-40 L0,-75 L60,-40 L70,30 L0,70 L-70,30 Z" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3"/>
    <!-- Inner Emblem -->
    <path d="M-45,-25 L0,-50 L45,-25 L52,20 L0,50 L-52,20 Z" fill="#1b4332"/>
    <!-- Center Letter C / Crunch icon -->
    <text x="0" y="24" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="64" fill="url(#goldGrad)">CC</text>
  </g>

  <!-- Typography -->
  <text x="256" y="340" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4" filter="url(#logoGlow)">CRAZY CRUNCH</text>
  <text x="256" y="380" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="url(#goldGrad)" letter-spacing="6">KHARI • TOAST • COOKIES</text>
  <text x="256" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#fdfbf7" opacity="0.85" letter-spacing="2">KOLHAPUR FRESH</text>
</svg>